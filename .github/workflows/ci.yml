name: CI

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить ruff
        run: pip install ruff

      - name: Синтаксис и явные ошибки
        run: ruff check --select E9,F63,F7,F82 .

      - name: Всё компилируется
        run: |
          if [ -d src ]; then
            python -m compileall -q src
          else
            python -m compileall -q -x '(^|/)(\.git|\.venv|venv|env|node_modules|build|dist)/' .
          fi